<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#F1F5F9"/>
  <!-- Arm Mount -->
  <path d="M 80 80 L 200 80 L 200 140 L 160 140 L 160 100 L 80 100 Z" fill="#334155"/>
  <!-- Motor Base -->
  <rect x="150" y="140" width="100" height="50" rx="8" fill="#475569"/>
  <!-- PTZ Globe -->
  <circle cx="200" cy="230" r="75" fill="#1E293B"/>
  <circle cx="200" cy="240" r="45" fill="#0284C7"/>
  <circle cx="200" cy="240" r="22" fill="#0F172A"/>
  <circle cx="190" cy="230" r="6" fill="#FFFFFF" opacity="0.7"/>
  <!-- Dual Antennas -->
  <line x1="160" y1="140" x2="120" y2="60" stroke="#0A382C" stroke-width="8" stroke-linecap="round"/>
  <line x1="240" y1="140" x2="280" y2="60" stroke="#0A382C" stroke-width="8" stroke-linecap="round"/>
  <!-- Motion Arrows -->
  <path d="M 100 230 A 100 100 0 0 1 300 230" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="200" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0A382C" text-anchor="middle">360° PAN-TILT-ZOOM</text>
</svg>
